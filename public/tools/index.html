body.ml,body.ml button,body.ml input,body.ml select{font-family:"Noto Serif Malayalam",serif}
body.ml nav button,body.ml .seg button{font-size:14px}
body.ml th,body.ml td:first-child,body.ml h2,body.ml .logo,body.ml .tools b{font-weight:700}
.sar{width:.8em;height:.9em;vertical-align:-.12em;fill:currentColor;display:inline-block}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 Manrope,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg)}
.bar{max-width:960px;margin:auto;padding:0 20px;display:flex;align-items:center;gap:8px}
.logo{font-family:"Source Serif 4",Georgia,serif;font-weight:700;font-size:20px;letter-spacing:-.01em;margin-right:12px;display:flex;align-items:center;gap:10px;padding:12px 0;white-space:nowrap}
.logo img{border-radius:50%;display:block}
.logo b{color:var(--ac);font-weight:700}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
nav::-webkit-scrollbar{display:none}
nav button{border:0;background:none;color:var(--mut);padding:9px 16px;margin:10px 0;border-radius:999px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s}
nav button:hover{color:var(--tx)}
nav button.on{color:var(--tx);background:var(--tint)}
.seg{display:flex}
.seg button,.ghost{border:0;background:none;color:var(--mut);padding:8px;min-width:40px;min-height:40px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;border-radius:8px}
.seg button.on{color:var(--tx)}
.seg button:hover,.ghost:hover{color:var(--tx);background:var(--tint)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
main{max-width:960px;margin:auto;padding:28px 20px 16px}
.hero{display:flex;flex-wrap:wrap;gap:8px 40px;align-items:flex-end;justify-content:space-between;padding:0 0 28px;color:var(--tx)}
.hero small{display:block;color:var(--mut);font-size:14px;font-weight:600}
.hero .big{font-size:clamp(36px,8vw,60px);font-weight:700;letter-spacing:-.03em;line-height:1.1}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:0 0 20px}
.stat,.card{background:var(--card);border:0;border-radius:22px;padding:20px}
.stat b{display:block;font-size:22px;font-weight:700;letter-spacing:-.01em;margin:2px 0}
.stat span,.mut{color:var(--mut);font-size:13px}
.grid{display:grid;grid-template-columns:3fr 2fr;gap:16px;align-items:start}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:14px 0;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap;font-size:16px}
th{color:var(--mut);font-weight:600;font-size:13px;padding-top:0}
th:first-child,td:first-child{text-align:left}
td:first-child{font-weight:700;font-size:15px}
td:not(:first-child){font-weight:600;padding-left:16px}
tr:last-child td{border:0;padding-bottom:0}
.up{color:var(--ok)}.dn{color:var(--no)}
label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:14px 0 6px}
input,select{width:100%;padding:11px 14px;border:1px solid transparent;border-radius:14px;background:var(--tint);color:var(--tx);font:inherit;min-height:46px}
input:focus,select:focus{border-color:var(--ac)}
.res{margin-top:16px;padding:18px;border-radius:16px;background:var(--tint)}
.res b{font-size:30px;font-weight:700;letter-spacing:-.02em;color:var(--tx)}
h2{margin:0 0 14px;font-size:16px;font-weight:700}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card[data-t]{transition:border-color .15s}
.card[data-t]:hover{background:var(--tint)}
.tools .card b{display:block;font-size:17px;margin-bottom:2px}
.soon{opacity:.5;border-style:dashed}
.note{font-size:12.5px;color:var(--mut);margin-top:14px}
footer{text-align:center;color:var(--mut);font-size:13px;padding:36px 20px 28px}
section[hidden]{display:none}
@media(max-width:800px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.bar{flex-wrap:wrap;padding:0 16px}.logo{padding:12px 0}nav{order:3;flex-basis:100%;margin:0 -16px;padding:0 8px}.logo{margin-right:auto}main{padding:20px 16px 8px}}
@media(max-width:480px){.card,.stat{padding:16px}.hero{padding-bottom:20px}}
.ttl{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 18px;font-size:24px;font-weight:700;letter-spacing:-.02em}
.ttl span{font-size:13px;color:var(--mut);font-weight:500;letter-spacing:0}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.tile{background:var(--card);border:0;border-radius:24px;padding:18px;min-height:156px;display:flex;flex-direction:column;cursor:pointer;text-align:left;color:inherit;font:inherit;transition:background .15s}
.tile:hover,.promo:hover{background:var(--tint)}
.tile .lb{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:14px;font-weight:600}
.tile .lb svg{width:18px;height:18px;flex:none}
.tile .nm{font-size:clamp(26px,5.5vw,36px);font-weight:700;letter-spacing:-.02em;margin-top:12px;line-height:1.1}
.tile .ft{margin-top:auto;padding-top:14px;color:var(--mut);font-size:14px;line-height:1.4}
.dl{font-size:14px;font-weight:600;margin-top:6px}
.sec{font-size:18px;font-weight:700;margin:30px 0 12px}
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;margin:0 -20px;padding:0 20px 4px}
.rail::-webkit-scrollbar{display:none}
.rail .tile{min-width:176px;min-height:132px;scroll-snap-align:start;flex:0 0 auto}
.promo{display:flex;align-items:center;gap:14px;background:var(--card);border:0;border-radius:24px;padding:18px;margin-top:12px;cursor:pointer;width:100%;text-align:left;color:inherit;font:inherit;transition:background .15s}
.promo .t{flex:1}.promo b{display:block;font-size:16px}.promo span{color:var(--mut);font-size:14px}
.go{width:46px;height:46px;border-radius:50%;background:color-mix(in srgb,var(--ac) 20%,transparent);color:var(--ac);display:grid;place-items:center;flex:none}
.dock{display:none}
@media(max-width:800px){
 main{padding-bottom:110px}
 .dock{display:flex;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(420px,calc(100% - 24px));background:var(--card);border-radius:30px;padding:8px 6px;justify-content:space-around;z-index:6;box-shadow:0 10px 34px rgba(0,0,0,.35)}
 .dock button{border:0;background:none;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px;font:inherit;font-size:11px;font-weight:600;padding:8px 10px;border-radius:20px;cursor:pointer;min-width:58px}
 .dock button.on{color:var(--ac)}
}
.welcome{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:16px;background:#1d4b3a;color:#f4f2ec;border-radius:28px;padding:24px 24px 24px 26px;margin-bottom:14px}
.welcome::before,.welcome::after{content:"";position:absolute;border-radius:50%;border:1.5px solid rgba(244,242,236,.10);pointer-events:none}
.welcome::before{width:260px;height:260px;right:-60px;top:-70px}
.welcome::after{width:420px;height:420px;right:-140px;top:-150px}
.welcome h1{margin:0;font:700 clamp(26px,6vw,36px)/1.1 "Source Serif 4",Georgia,serif;letter-spacing:-.01em}
.welcome p{margin:8px 0 0;color:rgba(244,242,236,.72);font-size:14px}
.welcome .d{display:inline-block;margin-top:14px;padding:5px 12px;border-radius:999px;background:rgba(244,242,236,.12);font-size:13px;font-weight:600}
.welcome svg{flex:none;width:clamp(92px,22vw,140px);height:auto;position:relative;z-index:1}
.spark{margin-top:10px;height:36px}
.chart{margin:4px 0 6px}
.chart .ax{display:flex;justify-content:space-between;color:var(--mut);font-size:12px;margin-top:6px}
footer svg{display:block;margin:0 auto 10px;opacity:.9}
.nx td{color:var(--ac)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:6px}
.cal div{aspect-ratio:1/1;border-radius:14px;background:var(--tint);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:16px;line-height:1.1}
.cal small{font-size:10px;font-weight:500;color:var(--mut);margin-top:2px}
.cal .wd{background:none;aspect-ratio:auto;font-size:12px;color:var(--mut);font-weight:600;padding:4px 0}
.cal .e{background:none}
.cal .t{background:var(--ac);color:var(--bg)}.cal .t small{color:var(--bg);opacity:.8}
.trh{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px}.trh h2{margin:0}
.trh .seg button{font-size:13px;padding:6px 12px;min-height:34px;border-radius:999px}.trh .seg button.on{background:var(--tint);color:var(--tx)}
.trs{display:flex;gap:18px;font-size:13px;color:var(--mut);margin-top:10px;flex-wrap:wrap;font-weight:600}.trs b{color:var(--tx)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function calcPrayer(date,lat,lng,tz,asrF,isha){

 let Y=date.getFullYear(),M=date.getMonth()+1;const D=date.getDate();if(M<=2){Y--;M+=12}const A=Math.floor(Y/100),B=2-A+Math.floor(A/4);
 const J=Math.floor(365.25*(Y+4716))+Math.floor(30.6001*(M+1))+D+B-1524.5-lng/360;
 const sp=jd=>{const d=jd-2451545,g=fix(357.529+0.98560028*d,360),q=fix(280.459+0.98564736*d,360),L=fix(q+1.915*sin(g)+0.020*sin(2*g),360),e=23.439-0.00000036*d,RA=fix(Math.atan2(cos(e)*sin(L),cos(L))/R/15,24);return{decl:Math.asin(sin(e)*sin(L))/R,eqt:q/15-RA}};
 const mid=t=>fix(12-sp(J+t).eqt,24);
 const ang=(a,t,ccw)=>{const dc=sp(J+t).decl,x=(-sin(a)-sin(dc)*sin(lat))/(cos(dc)*cos(lat));if(Math.abs(x)>1)return NaN;const h=acos(x)/15;return mid(t)+(ccw?-h:h)};
 const asr=(f,t)=>{const dc=sp(J+t).decl;return ang(-acot(f+tan(Math.abs(lat-dc))),t,false)};
 const adj=t=>t+tz-lng/15;
 const mg=adj(ang(0.833,18/24,false));
 return{fajr:adj(ang(18.5,5/24,true)),sunrise:adj(ang(0.833,6/24,true)),dhuhr:adj(mid(12/24)),asr:adj(asr(asrF,13/24)),maghrib:mg,isha:mg+isha/60};
}

     <label>${tt('Year (AH)')}</label><input id="hy" type="number" min="1300" max="1600" value="${td.y}" inputmode="numeric">
     <div class="res"><b id="hgo" style="font-size:22px"></b></div></div></div>
  </div>`;
  const u1=()=>{const v=$('#cg').value.split('-').map(Number);const h=v.length===3&&v[0]?HP(new Date(Date.UTC(v[0],v[1]-1,v[2],12)),true):null;$('#cgo').textContent=h?hs(h):'—'};
  const u2=()=>{const t=hToG(+$('#hy').value,+$('#hm').value,+$('#hd').value);$('#hgo').textContent=t?t.toLocaleDateString(LOC(),{weekday:'short',day:'numeric',month:'long',year:'numeric',timeZone:'UTC'}):'—'};
  $('#cg').addEventListener('input',u1);['hd','hm','hy'].forEach(i=>$('#'+i).addEventListener('input',u2));u1();u2();
}
function renderCalc(){
  $('#main').innerHTML=`<div class="card" style="max-width:560px;margin:auto"><h2>${tt('Gold Calculator')}</h2>
  <label>${tt('Weight (grams)')}</label><input id="w" type="number" min="0" step="0.01" value="10" inputmode="decimal">
  <label>${tt('Karat')}</label><select id="k">${KARATS.map((r,i)=>`<option value="${i}">${r.k}</option>`).join('')}</select>
  <label>${tt('Making charge per gram (optional)')} (${sym()})</label><input id="m" type="number" min="0" step="0.01" value="0" inputmode="decimal">
  <div class="res"><span class="mut">${tt('Estimated value')}</span><br><b id="out"></b><div class="mut" id="sub"></div></div></div>`;
  const u=()=>{const w=+$('#w').value||0,r=KARATS[+$('#k').value],m=+$('#m').value||0,v=w*gram24()*r.p,tot=v+w*m;
    $('#out').innerHTML=fmt(tot)+' '+sym();$('#sub').textContent=`${tt('Gold')}: ${fmt(v)} + ${tt('making')}: ${fmt(w*m)}`};
  ['w','k','m'].forEach(i=>$('#'+i).addEventListener('input',u));u();
}
function renderZakat(){
  $('#main').innerHTML=`<div class="card" style="max-width:560px;margin:auto"><h2>${tt('Zakat on Gold')}</h2>
  <label>${tt('Your gold weight (grams, 24K equivalent)')}</label><input id="w" type="number" min="0" value="100" inputmode="decimal">
  <div class="res"><span class="mut" id="st"></span><br><b id="out"></b><div class="mut" id="sub"></div></div>
  <div class="note">${tt('Nisab = 85 g of 24K gold, zakat rate 2.5%. Consult a scholar for your case.')}</div></div>`;
  const u=()=>{const w=+$('#w').value||0,val=w*gram24();
    $('#st').textContent=w>=85?tt('Above nisab – zakat is due'):tt('Below nisab (85 g)');
    $('#out').innerHTML=(w>=85?fmt(val*.025):'0.00')+' '+sym();$('#sub').innerHTML=tt('Gold value')+': '+fmt(val)+' '+sym()};
  $('#w').addEventListener('input',u);u();
}
function renderHome(){
  const NP=nextPrayer();
  const g=LIVE.rows||{}, r24=g['24K']?g['24K'].rate:gram24(), h=SILVER.hist, sd=h.length>1?h[0][1]-h[1][1]:0;
  const get=c=>FX.list.find(x=>x[0]===c)||[c,c,0], f=FUEL.fuels[0]||{price:0,note:''};
  const rf=n=>n>=1000?n.toLocaleString('en-US',{maximumFractionDigits:2}):n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  const dl=d=>d===0?'':`<div class="dl ${d>0?'up':'dn'}">${d>0?'▲':'▼'} ${Math.abs(d).toFixed(2)}</div>`;
  const tile=(id,ic,lb,nm,ft,ex='')=>`<button class="tile" data-t="${id}"><div class="lb">${ico(ic,18)}${lb}</div><div class="nm">${nm}</div>${ex}<div class="ft">${ft}</div></button>`;
  const rail=['INR','PKR','BDT','PHP','LKR','NPR','EGP','AED'].map(c=>{const x=get(c);return `<button class="tile" data-t="fx"><div class="lb">SAR → ${c}</div><div class="nm">${rf(x[2])}</div><div class="ft">1,000 ${sym()} ≈ ${rf(x[2]*1000)}</div></button>`}).join('');
  const promo=(id,t,d)=>`<button class="promo" data-t="${id}"><div class="t"><b>${tt(t)}</b><span>${tt(d)}</span></div><div class="go">${ico('arrow',20)}</div></button>`;
  $('#main').innerHTML=`<div class="welcome"><div><h1>${tt("Today's rates")}</h1><p>${tt('Gold')} · ${tt('Silver')} · ${tt('Currency')} · ${tt('Fuel')}</p><span class="d">${new Date().toLocaleDateString(lang==='ml'?'ml-IN':'en-GB',{day:'numeric',month:'short',year:'numeric'})}</span>${HP(riyadhNow())?`<span class="d" style="margin-left:8px">${hs(HP(riyadhNow()))}</span>`:''}</div>${BUBBLE}</div>
  <button class="promo" data-t="prayer" style="margin:0 0 12px"><div class="t"><span>${tt('Next prayer')} · ${tt(PC)}</span><b id="hnp">${tt(PNM[NP.k])} ${fmtT(NP.h)} · ${durT(NP.diff)}</b></div><div class="go">${ico('arrow',20)}</div></button>
  <div class="tiles">
   ${tile('gold','gold',tt('Gold')+' 24K',sym()+' '+fmt(r24),tt('per gram')+(g['22K']?' · 22K '+fmt(g['22K'].rate):''),dl(gDelta())+`<div class="spark">${spark(ghist().filter(p=>p[0]>=ghist().slice(-1)[0][0]-6048e5).map(p=>p[1]))}</div>`)}
   ${tile('silver','silver',tt('Silver')+' 999',sym()+' '+fmt(SILVER.rows['999']),tt('per gram'),dl(sd)+`<div class="spark">${spark(h.slice().reverse().map(x=>x[1]))}</div>`)}
   ${tile('fuel','fuel',tt('Gasoline 91'),sym()+' '+f.price.toFixed(2),tt('per litre')+' · '+tt(f.note).replace(/SAR\s*/,SYM+' '))}
   ${tile('fx','fx',tt('Exchange Rates'),rf(get('INR')[2])+' INR','1 '+sym()+' = INR · PKR '+rf(get('PKR')[2]))}
  </div>
  <div class="sec">${tt('Popular rates')}</div><div class="rail">${rail}</div>
  <div class="sec">${tt('Calculators')}</div>
  ${promo('calc','Gold Calculator','Value by weight & karat')}${promo('zakat','Zakat Calculator','Gold zakat estimate')}`;
}
document.addEventListener('click',e=>{
  const tb=e.target.closest('[data-tm]');if(tb){TM=tb.dataset.tm==='0'?0:TM+ +tb.dataset.tm;return renderToday()}
  const rb=e.target.closest('[data-r]');if(rb){GR=rb.dataset.r;return renderGold()}
  const t=e.target.closest('[data-t]');if(t)return go(t.dataset.t);
  const l=e.target.closest('#lng button');if(l){lang=l.dataset.l;try{localStorage.setItem('ghl',lang)}catch(x){}syncLang();return go(tool)}
  const c=e.target.closest('#cur button');if(c){cur=c.dataset.c;save();syncCur();go(tool)}
});
function syncLang(){document.body.classList.toggle('ml',lang==='ml');document.documentElement.lang=lang==='ml'?'ml':'en';document.querySelectorAll('#lng button').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));document.querySelector('footer').textContent=tt('Prices are indicative only. Always confirm with your jeweller. · © hello_saudi.sa');document.title=lang==='ml'?'hello_saudi.sa – സ്വർണ്ണം, വെള്ളി, നിരക്കുകൾ':'hello_saudi.sa – Gold, Silver & Rates'}
function syncCur(){document.querySelectorAll('#cur button').forEach(b=>b.classList.toggle('on',b.dataset.c===cur))}
try{document.documentElement.dataset.theme=localStorage.getItem('ght')||'dark'}catch(e){document.documentElement.dataset.theme='dark'}
$('#theme').onclick=()=>{const d=document.documentElement,t=d.dataset.theme==='dark'?'light':'dark';d.dataset.theme=t;try{localStorage.setItem('ght',t)}catch(e){}};
syncLang();syncCur();go('home');
async function poll(){if(!FEED_URL)return;try{const r=await fetch(FEED_URL,{cache:'no-store'});const d=await r.json();if(!d.rows||!d.rows['24K'])throw 0;LIVE={ok:true,...d};S.oz=d.rows['24K'].rate/SAR_PER_USD*OZ;gRecord();if(tool==='gold'&&!(document.activeElement&&document.activeElement.tagName==='INPUT'))renderGold()}catch(e){LIVE.ok=false}}
async function pollSilver(){if(!FEED_URL)return;try{const r=await fetch(FEED_URL.replace(/gold$/,'silver'),{cache:'no-store'});const d=await r.json();if(!d.rows||!d.rows['999'])throw 0;SILVER={...SILVER,ok:true,...d};const a=document.activeElement&&document.activeElement.tagName;if(tool==='silver'&&a!=='INPUT'&&a!=='SELECT')renderSilver()}catch(e){SILVER.ok=false}}
const busy=()=>{const a=document.activeElement&&document.activeElement.tagName;return a==='INPUT'||a==='SELECT'};
async function pollFX(){if(!FEED_URL)return;try{const d=await (await fetch(FEED_URL.replace(/gold$/,'fx'),{cache:'no-store'})).json();if(!d.list||d.list.length<5)throw 0;FX={ok:true,...d};if(tool==='fx'&&!busy())renderFX()}catch(e){FX.ok=false}}
async function pollFuel(){if(!FEED_URL)return;try{const d=await (await fetch(FEED_URL.replace(/gold$/,'fuel'),{cache:'no-store'})).json();if(!d.fuels||d.fuels.length<3)throw 0;FUEL={...FUEL,ok:true,...d};if(tool==='fuel'&&!busy())renderFuel()}catch(e){FUEL.ok=false}}
const pollAll=()=>Promise.all([poll(),pollSilver(),pollFX(),pollFuel()]).then(()=>{if(tool==='home'&&!busy())renderHome()});
pollAll();setInterval(pollAll,30000);setInterval(tickPrayer,1000);
</script>
